version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: allfeat-validator-node_web_1
      APP_PORT: 80

  validator:
    image: ghcr.io/plzrf/allfeat-validator:latest
    restart: on-failure
    stop_grace_period: 1m
    user: "1000:1000"
    entrypoint:
      - /bin/sh
      - -lc
    env_file:
      - ${APP_DATA_DIR}/data/admin/config/node.env
    volumes:
      - ${APP_DATA_DIR}/data/chain:/data/chain
      - ${APP_DATA_DIR}/data/admin:/data/admin
      - ./scripts/start-validator.sh:/start-validator.sh:ro
    ports:
      - "30333:30333/tcp"
    command: exec sh /start-validator.sh

  web:
    image: nginx:1.27-alpine
    restart: on-failure
    volumes:
      - ./web:/usr/share/nginx/html:ro
